name: Build Beacon Android APK

on:
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.38.5'
  CHANNEL: 'prod'
  IS_GITHUB_ACTIONS: 1

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17

      - name: Setup Flutter
        uses: subosito/flutter-action@v2.21.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install build deps
        run: make android-apk-install-deps

      - name: Prepare (pub get, codegen, download core libs)
        run: make android-apk-prepare

      - name: Build release APK
        run: flutter build apk --release

      - name: List outputs
        run: ls -lR build/app/outputs/flutter-apk/ || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: beacon-android-apk
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
