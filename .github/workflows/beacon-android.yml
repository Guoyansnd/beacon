name: Build Beacon Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

env:
  FLUTTER_VERSION: '3.38.5'
  CHANNEL: 'prod'
  IS_GITHUB_ACTIONS: 1

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute version
        id: ver
        shell: bash
        run: |
          BUILD=$(git rev-list --count HEAD)
          echo "build=$BUILD" >> $GITHUB_OUTPUT
          echo "name=4.1.$BUILD" >> $GITHUB_OUTPUT
          echo "code=$((40102 + BUILD))" >> $GITHUB_OUTPUT
          echo "版本: 4.1.$BUILD (versionCode $((40102 + BUILD)))"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17

      - name: Setup Flutter
        uses: subosito/flutter-action@v2.21.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install build deps
        run: make android-apk-install-deps

      - name: Prepare (pub get, codegen, download core libs)
        run: make android-apk-prepare

      - name: Build release APK
        run: flutter build apk --release --split-per-abi --target lib/main_prod.dart --dart-define=sentry_dsn= --build-name=${{ steps.ver.outputs.name }} --build-number=${{ steps.ver.outputs.code }}

      - name: List outputs
        run: ls -lR build/app/outputs/flutter-apk/ || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: beacon-android-apk
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error

      # 发布成 Release：产生公开直链，免登录即可下载（迅雷/手机浏览器/服务器都能抓）
      - name: Publish to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.name }}
          name: 灯塔 Beacon v${{ steps.ver.outputs.name }}
          body: |
            灯塔 (Beacon) 安卓版自动构建
            - 手机装 `app-arm64-v8a-release.apk`（绝大多数机型）
            - 不确定机型就装 `app-release.apk`（通用版）
          files: build/app/outputs/flutter-apk/*.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
