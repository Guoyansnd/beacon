name: Build Beacon Windows

on:
  workflow_dispatch:
  push:
    branches: [ main ]

env:
  FLUTTER_VERSION: '3.38.5'
  CHANNEL: 'prod'
  IS_GITHUB_ACTIONS: 1

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute version
        id: ver
        shell: bash
        run: |
          BUILD=$(git rev-list --count HEAD)
          echo "name=4.1.$BUILD" >> $GITHUB_OUTPUT
          echo "code=$((40102 + BUILD))" >> $GITHUB_OUTPUT

      - name: Setup Flutter
        uses: subosito/flutter-action@v2.21.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install build deps
        run: make windows-install-deps
        shell: bash

      - name: Prepare (pub get, codegen, download core libs)
        run: make windows-prepare
        shell: bash

      - name: Build Windows release
        run: flutter build windows --release --target lib/main_prod.dart --dart-define=portable=true --dart-define=sentry_dsn= --build-name=${{ steps.ver.outputs.name }} --build-number=${{ steps.ver.outputs.code }}
        shell: bash

      - name: Package portable zip
        shell: pwsh
        run: |
          $src = "build/windows/x64/runner/Release"
          if (-not (Test-Path $src)) { $src = "build/windows/runner/Release" }
          Write-Host "Packing from $src"
          Get-ChildItem $src | Select-Object Name, Length
          New-Item -ItemType Directory -Force out | Out-Null
          Compress-Archive -Path "$src/*" -DestinationPath "out/Beacon-Windows-x64-Portable.zip" -Force
          Get-ChildItem out

      - name: Try building installer (optional)
        continue-on-error: true
        shell: bash
        run: |
          make windows-exe-release || echo "installer step failed, portable zip is still available"
          ls -R dist/ || true

      - name: Collect installer if produced
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p out
          find dist -name '*.exe' -exec cp {} out/ \; || true
          ls -l out/ || true

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: beacon-windows
          path: out/*
          if-no-files-found: error

      # 发布成 Release：公开直链，免登录下载
      - name: Publish to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.name }}
          name: 灯塔 Beacon v${{ steps.ver.outputs.name }}
          body: |
            灯塔 (Beacon) Windows 版自动构建
            - 便携版：解压后运行 Beacon.exe，免安装
            - 若有 setup.exe 则为安装版
          files: out/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
